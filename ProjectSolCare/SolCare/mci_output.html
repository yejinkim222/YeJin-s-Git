<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolCare - MCI 예측 결과</title>
  <link rel="stylesheet" href="css/mci_output.css" />
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">SolCare</a></div>
    <nav>
      <ul>
        <li><a href="disease.html">질병 정보</a></li>
        <li>
          <a href="#">치매 예측 서비스</a>
          <ul class="dropdown">
            <li><a href="mci_input.html">MCI 예측</a></li>
            <li><a href="elderly.html">독거노인 예측</a></li>
          </ul>
        </li>
        <li><a href="map.html">치매 센터 안내</a></li>
        <li><a href="#">로그인/회원가입</a></li>
      </ul>
    </nav>
  </header>
  <div class="container">
      <h2 class="title">치매 발병 예측 결과</h2>

      <!-- 그래프 영역 -->
      <div class="graph-box">
          <canvas id="riskCanvas" width="640" height="320"></canvas>
          <div class="legend">
              <div><span class="marker model-center"></span>예측 발병 시점</div>
              <div><span class="marker user-input"></span>예측 기준 시점</div>
          </div>
      </div>

      <!-- 해석 문구가 들어갈 영역 -->
      <div class="analysis-box" id="analysisBox">
          <!-- JS에서 상황(early/late)에 따라 내용과 배경색이 바뀜 -->
      </div>

      <!-- 주의사항 -->
      <div class="notice-box">
          ⚠️ 본 결과는 모델 예측을 기반으로 생성한 임의의 시각 자료로 실제 발병 시점과 차이가 있을 수 있습니다.
      </div>
  </div>
  <script src="js/mci_output.js"></script>
</body>
</html>
