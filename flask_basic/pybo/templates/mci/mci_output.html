{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mci/mci_output.css') }}">
{% endblock %}

{% block content %}
<div class="container">
  <h2 class="title">치매 발병 예측 결과</h2>

  <!-- 그래프 영역 -->
  <div class="graph-box">
    <canvas id="riskCanvas" width="640" height="320"></canvas>
    <div class="legend">
      <div><span class="marker model-center"></span>예측 발병 시점</div>
      <div><span class="marker user-input"></span>예측 기준 시점</div>
    </div>
  </div>

  <!-- 해석 문구 -->
  <div class="analysis-box" id="analysisBox"></div>

  <!-- 주의사항 -->
  <div class="notice-box">
    ⚠️ 본 결과는 모델 예측을 기반으로 생성한 시각 자료로 실제 발병 시점과 차이가 있을 수 있습니다.
  </div>

  <!-- 서버 값 전달 (JS에서 읽어 사용) -->
  <div id="predict-data"
       data-yhat="{{ yhat|default('') }}"
       data-base-yrs="{{ input_data.base_yrs|default('') }}">
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/mci_js/mci_output.js') }}" defer></script>
{% endblock %}
